<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>魔法书与扫帚 · Rigby2D 验证</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f2ed;color:#293b36;font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1120px;margin:32px auto;padding:0 24px}.eyebrow{font-size:12px;letter-spacing:3px;color:#7a8b79}h1{font-size:30px;margin:6px 0}header p{margin:0 0 22px;color:#728078}.badge{float:right;border:1px solid #ced8ca;border-radius:30px;padding:6px 14px;font-size:12px}.stage{position:relative;aspect-ratio:1000/570;background:radial-gradient(ellipse at 50% 75%,#f9f6e9,#e9e2ef);border-radius:24px;overflow:hidden;border:1px solid #d8e1d4;box-shadow:0 12px 40px #34493409}.stage:before{content:"";position:absolute;left:8%;right:8%;top:86%;border-top:1px solid #b9c9b2}canvas{position:absolute;width:100%;height:100%;inset:0}.caption{position:absolute;left:0;right:0;top:18px;text-align:center;color:#56705d;font-size:13px}.controls{background:#fff;border:1px solid #e3e7dc;border-radius:18px;margin-top:16px;padding:18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}button,select{font:inherit;border:1px solid #cad4c6;border-radius:9px;padding:8px 16px;background:#fff;color:#304d3d;cursor:pointer}button.primary{background:#365d49;color:white;border-color:#365d49}input[type=range]{flex:1;min-width:150px;accent-color:#365d49}#clock{font-variant-numeric:tabular-nums;font-size:13px}.beats{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.beats button{font-size:13px;border:0;background:#e8ece3}.beats button.active{background:#d5e5cc;color:#244c30}.note{font-size:12px;color:#788275;margin-top:20px}#error{color:#a42c39;white-space:pre-wrap}details{font-size:12px;color:#788275;margin-top:12px}#metrics{font-variant-numeric:tabular-nums}@media(max-width:600px){main{margin:18px auto;padding:0 12px}h1{font-size:23px}.badge{display:none}.controls{gap:8px;padding:12px}button{padding:8px 12px}}
</style></head><body><main>
<header><span class="badge">本地原型 · 无大模型</span><div class="eyebrow">TINY ROLEPLAY / 02</div><h1>一本从天而降的魔法书</h1><p>砸头、拾起、收纳，再骑上扫帚飞走。<a href="rigby-validation.html?cast=white">返回苹果小剧场</a></p></header>
<section class="stage" aria-label="魔法书与扫帚动画舞台"><canvas id="rear"></canvas><canvas id="characters"></canvas><canvas id="props"></canvas><div class="caption" id="phase">正在加载白发角色…</div></section>
<div class="controls"><button id="play" class="primary" disabled>播放</button><button id="replay" disabled>从头重播</button><input id="seek" aria-label="动画进度" type="range" min="0" max="24" step="0.01" value="0"><span id="clock">0.0 / 24.0 s</span><label>速度 <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select></label><label><input id="loop" type="checkbox" checked>循环</label></div>
<div class="beats"></div>
<div class="controls seat-controls"><strong>侧坐微调</strong><label>裙摆收拢 <input id="gather" aria-label="裙摆收拢" type="range" min="0" max="1.4" step="0.05" value="1"></label><label>裙摆侧移 <input id="drape" aria-label="裙摆侧移" type="range" min="0.6" max="1.3" step="0.05" value="1"></label><label>小腿倾斜 <input id="leg-tilt" aria-label="小腿倾斜" type="range" min="-15" max="15" step="1" value="0"></label><button id="seat-reset">恢复坐姿参数</button><small>点击“⑦ 淑女侧坐”暂停后调节，播放时同样有效。</small></div>
<div id="error" role="alert"></div><details><summary>验证说明</summary><p>24 秒确定性编排；可拖动进度、逐段暂停检查。侧坐时双腿并拢，裙摆使用局部网格变形；仍是正面素材的二维近似。</p></details>
<p class="note">现有白发拆层素材 · 无新增依赖 · 原图与 PSD 未改动</p>
</main><script type="module" src="src/rigby-magic.mjs"></script></body></html>

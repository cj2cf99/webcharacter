<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>白发角色 Rigby2D 绑定</title><style>body{font:15px/1.8 system-ui;margin:30px;background:#f4f2ed}pre{white-space:pre-wrap}button{padding:12px;font:inherit}</style><h1>现有拆层 → Rigby2D</h1><p>针对现有角色校准关节，生成腿部、手臂网格和手脚 IK。所有产物写入 work/rigby-white/，原图和 PSD 不变。生成后运行 node tools/promote-rig.mjs 更新演示资源。</p><button id="build">生成 / 重新生成</button><pre id="log">等待生成</pre><a href="../rigby-validation.html?cast=white">打开白发角色验证页</a><script type="module">
import {buildWhiteRig} from '../src/rigby-white-build.mjs';
const log=document.querySelector('#log'),button=document.querySelector('#build');
async function save(name,body){const r=await fetch('/save?name='+encodeURIComponent('rigby-white/'+name),{method:'POST',body});if(!r.ok)throw Error(await r.text());}
button.onclick=async()=>{button.disabled=true;log.textContent='正在准备图层和绑定…';try{const result=await buildWhiteRig();await save('character.json',JSON.stringify(result.json));await save('manifest.json',JSON.stringify({images:[...result.images.keys()],bones:result.bones,parts:result.report},null,2));for(const [name,c] of result.images){const bytes=Uint8Array.from(atob(c.toDataURL('image/png').split(',')[1]),x=>x.charCodeAt(0));await save(name+'.png',new Blob([bytes],{type:'image/png'}));}log.textContent=`已生成 ${result.bones} 根骨骼、${result.images.size} 张裁片。\n`+JSON.stringify(result.report,null,2);}catch(e){log.textContent='失败：'+e.stack;}finally{button.disabled=false;}};
</script></html>

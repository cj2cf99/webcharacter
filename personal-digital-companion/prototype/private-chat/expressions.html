<!doctype html>
<html lang="zh-CN">

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>绯月表情</title>
  <link rel="stylesheet" href="preview.css">
  <style>
    main { max-width: 1240px; }
    section + section { margin-top: 16px; }
    h2 { margin: 0 0 8px; font-size: 15px; }
    .faces { display: grid; gap: 9px; grid-template-columns: repeat(auto-fit,minmax(100px,1fr)); }
    .face { display: grid; gap: 6px; justify-items: center; padding: 8px 4px; background: var(--surface);
      border: 1px solid var(--line); border-radius: 13px; color: var(--text); text-decoration: none; }
    .face:is(:hover,:focus-visible) { outline: 2px solid var(--accent); }
    .face img { width: min(100%,120px); height: auto; aspect-ratio: 1; }
    .face span { font-size: 14px; }
    .face:only-child { justify-self: start; }
    a { color: var(--accent); }
  </style>
</head>

  <header class="page-head"><h1>绯月表情</h1><a href="index.html">专聊预览</a></header>

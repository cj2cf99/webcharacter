<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>绯月 · 动画与声音设置原型</title>
<style>
:root{color-scheme:dark;--bg:#101019;--panel:#191925;--line:#333344;--text:#eeedf8;--muted:#9c9bb2;--accent:#ad95ff;--input:#222232}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,'Microsoft Yahei',sans-serif}button,input,select{font:inherit}button,select,input[type=text],input[type=number]{background:var(--input);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px 12px}button{cursor:pointer}button:hover{border-color:var(--accent)}button:disabled{opacity:.4;cursor:default}input[type=range]{accent-color:var(--accent);width:100%}input[type=checkbox]{accent-color:var(--accent)}header{display:flex;align-items:center;gap:18px;padding:18px 28px;border-bottom:1px solid var(--line)}h1{font-size:20px;margin:0}small,.muted{color:var(--muted)}.grow{flex:1}.badge{font-size:12px;padding:5px 9px;border:1px solid var(--line);border-radius:20px;color:var(--muted)}main{max-width:1400px;margin:auto;padding:20px 28px}.top{display:grid;grid-template-columns:minmax(300px,.85fr) minmax(440px,1.5fr);gap:16px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:18px}h2{font-size:15px;margin:0 0 15px}.row{display:flex;align-items:center;gap:10px}.space{justify-content:space-between}.map{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.state{min-height:72px;text-align:left}.state b,.state small{display:block}.state small{margin-top:7px;font-size:11px}.state.active{background:#40345e;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}.route{padding:12px;border-radius:9px;background:var(--input);text-align:center;font-size:12px;color:var(--muted)}.master{border-top:1px solid var(--line);margin-top:20px;padding-top:16px}.master .row{margin:10px 0}.tabs{display:flex;gap:6px}.tabs button.active{background:var(--accent);color:#181222}.phases{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:17px 0}.phase{background:var(--input);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}.phase select{width:100%;margin:12px 0;background:var(--panel);font-size:12px;padding:8px}.phase .row{font-size:12px}.phase input[type=range]{margin:12px 0}.phase .effective{color:var(--accent);font-size:12px}.rules{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding-top:14px;border-top:1px solid var(--line);font-size:13px}.rules input[type=number]{width:65px;padding:5px}.note{margin-top:12px;font-size:12px;color:var(--muted);line-height:1.6}.library{margin-top:16px}.cards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-top:16px}.card{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--input)}.thumb{height:130px;background-color:#252431;background-image:linear-gradient(45deg,#30303d 25%,transparent 25%),linear-gradient(-45deg,#30303d 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#30303d 75%),linear-gradient(-45deg,transparent 75%,#30303d 75%);background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0;position:relative;display:grid;place-items:center}.thumb button{position:absolute;border-radius:50%;background:#181626dd;font-size:20px}.thumb video{width:100%;height:100%;object-fit:contain}.cardbody{padding:10px}.cardbody b{display:block;margin-bottom:6px;font-size:12px}.cardbody small{font-size:11px}.cardbody button{width:100%;margin-top:10px;font-size:12px;padding:6px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar input{width:210px}footer{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:12px 28px;display:flex;align-items:center;gap:10px;z-index:2}.primary{background:var(--accent);color:#181222;font-weight:600}#toast{color:var(--accent);font-size:12px}.light{--bg:#f3f2f7;--panel:#fff;--line:#dedbe7;--text:#282338;--muted:#777084;--accent:#7754d7;--input:#f5f3fa;color-scheme:light}.light .state.active{background:#e8dffd}.light .tabs button.active,.light .primary{color:white}@media(max-width:900px){.top{grid-template-columns:1fr}.cards{grid-template-columns:repeat(3,1fr)}}@media(max-width:520px){header,main{padding:14px}header{flex-wrap:wrap}.badge{display:none}.phases{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}footer{padding:12px;flex-wrap:wrap}.map{gap:7px}.state{padding:9px}.toolbar input{width:100%}}@media(prefers-reduced-motion:no-preference){button{transition:background .15s,border-color .15s}}
</style>
<header><span style="font-size:26px;color:var(--accent)">✦</span><div><h1>绯月 · 行为设置</h1><small>让每个动作，都有自己的表达</small></div><span class="grow"></span><span class="badge">离线原型 · 未连接桌宠</span><button id="theme">☀ 浅色</button></header>
<main><div class="top"><section class="panel"><div class="row space"><h2>状态关系</h2><small>选择节点进行配置</small></div><div class="map" id="states"></div><div class="route" id="route"></div><div class="note">拖拽移动与动画分离 · 强制播放不受拖拽打断</div><div class="master"><div class="row space"><b>♫ 总声音</b><label><input id="masterOn" type="checkbox" checked> 开启</label></div><div class="row"><input id="masterVolume" type="range" value="50"><output id="masterValue">50%</output></div><small>总音量 × 节点音量 = 实际音量</small></div></section>
<section class="panel"><div class="row space"><div><h2 id="title"></h2><small id="subtitle">为每个动作阶段指定动画与声音</small></div><div class="tabs"><button id="single">单段</button><button id="triple">进入 / 循环 / 退出</button></div></div><div id="phases" class="phases"></div><div class="rules"><label><input id="force" type="checkbox"> 强制播完</label><label id="singleRule">播放 <select id="playMode"><option value="once">一次</option><option value="loop">循环</option></select></label><label id="delayRule">特殊动作间隔 <input id="delay" type="number" min="1" value="10"> 秒</label></div><div class="note" id="forceNote"></div></section></div>
<section class="panel library"><div class="toolbar"><h2 style="margin:0">动画资源 <small id="count"></small></h2><span class="grow"></span><input id="search" type="text" placeholder="搜索动画名称"><button id="import">＋ 导入 WebM</button><input id="file" type="file" accept="video/webm,.webm" hidden></div><div class="note">点击 ▶ 播放一次，结束自动关闭 · “分配”应用到上方选中的阶段 · 导入仅本页演示</div><div class="cards" id="cards"></div></section><section class="panel library"><div class="toolbar"><h2 style="margin:0">♫ 语音资源</h2><span class="grow"></span><button id="audioImport">＋ 导入语音</button><input id="audioFile" type="file" accept="audio/*" hidden></div><div class="note">为选中的动画阶段分配语音 · 支持不配语音 · 本次导入仅用于原型预览</div><div id="audioCards" class="cards"></div></section></main>
<footer><span id="dirty">这是原型；真实设置请从桌宠右键「动画与声音设置 · 本地 PC」打开</span><span class="grow"></span><span id="toast" role="status"></span><button id="reset">恢复演示初始值</button><button class="primary" id="save">保存并应用 · 演示</button></footer>
<script>
const $=id=>document.getElementById(id);const states=[['idle','☾','基础待机'],['special','✧','特殊待机'],['hover','♡','悬停'],['click','✦','点击'],['work','✎','工作'],['drag','↗','拖拽']];
const assets=[['idle','基础待机','../output/idle-basic/normal.webm','循环'],['special','特殊待机 01','../output/four-states-v3/hover.webm','6 秒'],['hoverIn','悬停 · 进入','../output/hover-parts/hover.webm','0.67 秒'],['hoverLoop','悬停 · 循环','../output/hover-seamless/normal.webm','2 秒'],['hoverOut','悬停 · 退出','../output/hover-parts/hover-exit.webm','3.38 秒'],['click','开心打招呼','../output/four-states-v3/click.webm','6 秒'],['dragIn','拖拽 · 进入','../output/animation-speed/drag-enter.webm','1 秒'],['dragLoop','拖拽 · 循环','../output/animation-speed/drag-loop.webm','3 秒'],['dragOut','拖拽 · 退出','../output/animation-speed/drag-exit.webm','1 秒'],['workIn','工作 · 进入','../output/four-states-v3/work-enter.webm','7.75 秒'],['workLoop','工作 · 循环','../output/four-states-v3/work-loop.webm','1.92 秒'],['workOut','工作 · 退出','../output/four-states-v3/work-exit.webm','5.38 秒']];
const soundSnapshot={"idle":{"on":false,"volume":100,"voice":"voice1","delay":0},"idle-special":{"on":false,"volume":100,"voice":"voice1","delay":0},"hover":{"on":true,"volume":100,"voice":"hover","delay":0},"hover-loop":{"on":true,"volume":100,"voice":"hover-loop","delay":0},"hover-exit":{"on":true,"volume":100,"voice":"hover-exit","delay":0},"click":{"on":true,"volume":100,"voice":"click","delay":0},"work-enter":{"on":true,"volume":100,"voice":"work-enter","delay":0},"work-loop":{"on":false,"volume":100,"voice":"","delay":0},"work-exit":{"on":true,"volume":100,"voice":"work-exit","delay":0},"drag-enter":{"on":true,"volume":100,"voice":"drag-enter","delay":0},"drag-loop":{"on":false,"volume":100,"voice":"","delay":0},"drag-exit":{"on":true,"volume":100,"voice":"drag-exit","delay":0}};
function nodeSound(id,p){const node=id==='special'?'idle-special':p==='single'?id:p==='enter'&&id==='hover'?'hover':id+'-'+p;return {...(soundSnapshot[node]||{on:false,volume:100,voice:'',delay:0})}}
const defaults=()=>Object.fromEntries(states.map(([id])=>[id,{mode:['hover','work','drag'].includes(id)?'triple':'single',force:false,play:id==='idle'?'loop':'once',slots:{single:id,enter:id+'In',loop:id+'Loop',exit:id+'Out'},sound:Object.fromEntries(['single','enter','loop','exit'].map(p=>[p,nodeSound(id,p)]))}]));const voices=[["voice1","原统一语音（待机已关闭）","../assets/voice/unified-zh.wav"],["hover","悬停进入 · 诶呀","../assets/voice/nodes-20261118/hover.wav"],["hover-loop","悬停循环 · 轻快笑声","../assets/voice/nodes-20261118/hover-loop.wav"],["hover-exit","悬停退出 · 嗯","../assets/voice/nodes-20261118/hover-exit.wav"],["click","点击 · 嗨，我在哦","../assets/voice/nodes-20261118/click.wav"],["work-enter","工作进入 · 看我的","../assets/voice/nodes-20261118/work-enter.wav"],["work-exit","工作退出 · 搞定，不愧是我","../assets/voice/nodes-20261118/work-exit.wav"],["drag-enter","拖拽进入 · 诶，慢一点嘛","../assets/voice/nodes-20261118/drag-enter.wav"],["drag-exit","拖拽退出 · 呼，站稳啦","../assets/voice/nodes-20261118/drag-exit.wav"],["laugh-soft","✓ 已认可 · 停顿轻笑","../assets/voice/nodes-20261118/laugh-soft.wav"],["laugh-bell-v3","✓ 已认可 · 轻笑 A","../assets/voice/nodes-20261118/laugh-bell-v3.wav"],["greeting-dear","✓ 已认可 · 亲爱的，我在哦","../assets/voice/nodes-20261118/greeting-dear.wav"]];let previewAudio=null,audioTimer=null;let config=defaults(),selected='hover',slot='enter',activeVideo=null,stopPreview=null,urls=[],dirty=false;
function changed(){dirty=true;$('dirty').textContent='有未保存的演示更改';$('toast').textContent=''}function soundChange(){stopVoice();refreshLevels();$('toast').textContent='声音已即时应用（仅演示）'}
function refreshLevels(){$('masterValue').textContent=$('masterVolume').value+'%';document.querySelectorAll('[data-effective]').forEach(el=>{const s=config[selected].sound[el.dataset.effective];el.textContent='实际 '+($('masterOn').checked&&s.on?Math.round(Number($('masterVolume').value)*s.volume/100):0)+'%'})}
function draw(){const c=config[selected];$('states').replaceChildren();states.forEach(([id,icon,name])=>{const b=document.createElement('button');b.className='state'+(id===selected?' active':'');b.innerHTML=`<b>${icon} ${name}</b><small>${config[id].mode==='triple'?'进入 → 循环 → 退出':'单段动画'}${config[id].force?' · 强制':''}</small>`;b.onclick=()=>{selected=id;slot=config[id].mode==='triple'?'enter':'single';draw()};$('states').append(b)});$('title').textContent=states.find(s=>s[0]===selected)[2]+' · 节点配置';$('route').textContent=selected==='idle'?'基础待机 → 10秒 → 特殊待机 → 基础待机':'基础待机 ⇄ '+states.find(s=>s[0]===selected)[2];$('single').classList.toggle('active',c.mode==='single');$('triple').classList.toggle('active',c.mode==='triple');$('force').checked=c.force;$('singleRule').hidden=c.mode!=='single';$('delayRule').hidden=!['idle','special'].includes(selected);$('playMode').value=c.play;$('forceNote').textContent=c.force?'强制：当前小段播完后完整退出；期间仍可拖动窗口。保存动画配置会立即重启当前状态。':'即时：停止行为后立即结束单段或进入退出段。保存动画配置后立即应用。';$('phases').replaceChildren();$('phases').style.gridTemplateColumns=c.mode==='single'?'1fr':'';for(const p of c.mode==='single'?['single']:['enter','loop','exit']){const box=document.createElement('div');box.className='phase';box.style.borderColor=p===slot?'var(--accent)':'';box.onclick=()=>{slot=p;document.querySelectorAll('.phase').forEach(e=>e.style.borderColor='');box.style.borderColor='var(--accent)'};const label={single:'单段动画',enter:'① 进入',loop:'② 循环',exit:'③ 退出'}[p];box.innerHTML=`<b>${label}</b><select aria-label="${label}资源"></select><label class="muted">配套语音</label><select class="voiceSelect" aria-label="配套语音"></select><label class="row">延后 <input class="voiceDelay" type="number" min="0" max="60" step="0.1" style="width:75px" value="${c.sound[p].delay??0}"> 秒播放</label><div class="row space"><label><input type="checkbox" ${c.sound[p].on?'checked':''}> 节点声音</label><button title="试听" aria-label="试听${label}">♫</button></div><input aria-label="${label}音量" type="range" value="${c.sound[p].volume}"><div class="row space"><small class="volume">${c.sound[p].volume}%</small><span class="effective" data-effective="${p}"></span></div>`;const select=box.querySelector('select');select.add(new Option('请选择动画',''));assets.forEach(a=>select.add(new Option(a[1],a[0])));select.value=c.slots[p];select.onchange=()=>{c.slots[p]=select.value;changed()};box.querySelector('[type=checkbox]').onchange=e=>{c.sound[p].on=e.target.checked;soundChange()};box.querySelector('[type=range]').oninput=e=>{c.sound[p].volume=Number(e.target.value);box.querySelector('.volume').textContent=e.target.value+'%';soundChange()};const vs=box.querySelector('.voiceSelect');vs.add(new Option('不配语音',''));voices.forEach(v=>vs.add(new Option(v[1],v[0])));vs.value=c.sound[p].voice??'';vs.onchange=()=>{c.sound[p].voice=vs.value;changed()};box.querySelector('.voiceDelay').onchange=e=>{c.sound[p].delay=Math.max(0,Math.min(60,Number(e.target.value)||0));e.target.value=c.sound[p].delay;changed()};box.querySelector('button').onclick=()=>playVoice(c.sound[p],false);$('phases').append(box)}refreshLevels()}
function library(){stopPreview?.();$('cards').replaceChildren();const list=assets.filter(a=>a[1].includes($('search').value));$('count').textContent=assets.length+' 项';for(const a of list){const card=document.createElement('article');card.className='card';const thumb=document.createElement('div');thumb.className='thumb';const play=document.createElement('button');play.textContent='▶';play.setAttribute('aria-label','预览'+a[1]);thumb.append(play);play.onclick=()=>{stopPreview?.();const v=document.createElement('video');const close=()=>{clearTimeout(audioTimer);audioTimer=null;v.onended=null;v.onerror=null;v.pause();v.removeAttribute('src');v.load();thumb.replaceChildren(play);if(activeVideo===v){activeVideo=null;stopPreview=null}};stopPreview=close;v.onended=close;v.src=a[2];v.muted=true;v.loop=false;v.controls=true;v.playsInline=true;v.onerror=()=>{close();thumb.textContent='资源不可用';const retry=document.createElement('button');retry.textContent='重试';retry.onclick=()=>{thumb.replaceChildren(play)};thumb.append(retry)};thumb.replaceChildren(v);activeVideo=v;v.play().then(()=>{if(activeVideo===v&&config[selected].slots[slot]===a[0])playVoice(config[selected].sound[slot],true)}).catch(()=>{if(activeVideo===v){close();$('toast').textContent='预览未能播放，请重试'}})};const body=document.createElement('div');body.className='cardbody';const name=document.createElement('b');name.textContent=a[1];const meta=document.createElement('small');meta.textContent=a[3]+' · WebM';const assign=document.createElement('button');assign.textContent='分配到选中阶段';assign.onclick=()=>{config[selected].slots[slot]=a[0];changed();draw();$('toast').textContent='已分配：'+a[1]};body.append(name,meta,assign);card.append(thumb,body);$('cards').append(card)}if(!list.length)$('cards').textContent='没有匹配的动画'}
$('single').onclick=()=>{config[selected].mode='single';slot='single';changed();draw()};$('triple').onclick=()=>{config[selected].mode='triple';slot='enter';changed();draw()};$('force').onchange=e=>{config[selected].force=e.target.checked;changed();draw()};$('playMode').onchange=e=>{config[selected].play=e.target.value;changed()};$('delay').onchange=()=>{changed();$('route').textContent='基础待机 → '+$('delay').value+'秒 → 特殊待机 → 基础待机'};$('masterOn').onchange=soundChange;$('masterVolume').oninput=soundChange;$('search').oninput=library;$('theme').onclick=()=>{document.body.classList.toggle('light');$('theme').textContent=document.body.classList.contains('light')?'☾ 深色':'☀ 浅色'};$('import').onclick=()=>$('file').click();$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;if(!f.name.toLowerCase().endsWith('.webm')){$('toast').textContent='请选择 WebM';return}const u=URL.createObjectURL(f);urls.push(u);assets.push(['import'+Date.now(),f.name,u,'本次预览']);library();$('toast').textContent='导入仅保留在本次原型页面'};$('save').onclick=()=>{for(const [id,c]of Object.entries(config))for(const p of c.mode==='single'?['single']:['enter','loop','exit'])if(!assets.some(a=>a[0]===c.slots[p])){$('toast').textContent='请补全 '+states.find(s=>s[0]===id)[2]+' 的动画';return}dirty=false;$('dirty').textContent='演示已应用 · 未写入桌宠配置';$('toast').textContent='保存流程演示完成（刷新恢复）'};$('reset').onclick=()=>{config=defaults();selected='hover';slot='enter';$('masterOn').checked=true;$('masterVolume').value=50;$('delay').value=10;dirty=false;$('dirty').textContent='这是原型；真实设置请从桌宠右键「动画与声音设置 · 本地 PC」打开';draw()};window.addEventListener('pagehide',()=>{stopPreview?.();stopVoice();urls.forEach(URL.revokeObjectURL)});
function stopVoice(){clearTimeout(audioTimer);audioTimer=null;if(previewAudio){previewAudio.pause();previewAudio.currentTime=0;previewAudio=null}}
function playVoice(setting,delay){clearTimeout(audioTimer);audioTimer=null;const v=voices.find(v=>v[0]===setting.voice);const level=$('masterOn').checked&&setting.on?Number($('masterVolume').value)*setting.volume/10000:0;if(!v||!level){$('toast').textContent='未配语音或声音已关闭';return}const start=()=>{stopVoice();previewAudio=new Audio(v[2]);previewAudio.volume=level;previewAudio.play().catch(()=>{$('toast').textContent='语音无法播放，请检查资源'});previewAudio.onended=()=>{previewAudio=null}};if(delay&&setting.delay){$('toast').textContent='语音将在 '+setting.delay+' 秒后播放';audioTimer=setTimeout(start,setting.delay*1000)}else start()}
function audioLibrary(){$('audioCards').replaceChildren();voices.forEach(v=>{const card=document.createElement('div');card.className='card cardbody';const title=document.createElement('b');title.textContent=v[1];const listen=document.createElement('button');listen.textContent='▶ 试听';listen.onclick=()=>playVoice({voice:v[0],on:true,volume:100},false);const rename=document.createElement('button');rename.textContent='重命名';rename.onclick=()=>{const name=prompt('语音名称',v[1]);if(name?.trim()){v[1]=name.trim();audioLibrary();draw();changed()}};const assign=document.createElement('button');assign.textContent='分配到选中阶段';assign.onclick=()=>{config[selected].sound[slot].voice=v[0];changed();draw();$('toast').textContent='已分配语音：'+v[1]};card.append(title,listen,rename,assign);$('audioCards').append(card)})}
$('audioImport').onclick=()=>$('audioFile').click();$('audioFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const u=URL.createObjectURL(f);urls.push(u);voices.push(['voice'+Date.now(),f.name,u]);audioLibrary();draw();$('toast').textContent='已导入语音（本次原型）'};
$('masterOn').checked=true;$('masterVolume').value=50;config.click.sound.single.voice='greeting-dear';draw();library();audioLibrary();
</script></html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 36" fill="none">
  <defs>
    <path id="left" pathLength="1" d="M13.2 3c.1 3-1.2 4.4-4.2 5.4-3.4 1.2-4.2 3.5-2.8 6.5 1.3 2.9 4.1 4.9 3.9 8.1-.2 3.2-3.3 5.2-4.1 9.1"/>
    <path id="right" pathLength="1" d="M20.1 4.8c-.3 2.1.4 3.7 2.3 5.1 2.7 1.9 3 4.5 1.3 6.9-1.8 2.7-4.2 4.3-3.7 7.3.5 2.8 3.7 4.3 3.6 7.9"/>
    <radialGradient id="light"><stop stop-color="#fffbea"/><stop offset=".35" stop-color="#ffe8a2"/><stop offset="1" stop-color="#ed9265" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .trail { stroke-linecap:round;stroke-dasharray:.28 2;animation:trace .76s ease-in-out both }
    .second { animation-delay:.2s }
    .spark { transform-box:fill-box;transform-origin:center;animation:twinkle .35s .89s both }
    @keyframes trace {
      0% { stroke-dashoffset:.3;opacity:0 }
      12%,82% { opacity:1 }
      100% { stroke-dashoffset:-1;opacity:0 }
    }
    @keyframes twinkle {
      0% { opacity:0;transform:scale(.35) }
      38% { opacity:1;transform:scale(1.1) }
      100% { opacity:0;transform:scale(.65) }
    }
  </style>
  <g stroke="#eb9c58" stroke-width="4"><use class="trail" href="#left"/><use class="trail second" href="#right"/></g>
  <g stroke="#fff1bb" stroke-width="1.9"><use class="trail" href="#left"/><use class="trail second" href="#right"/></g>
  <g opacity="0">
    <circle r="4.2" fill="url(#light)"/><circle r="1.25" fill="#fff9df"/>
    <animateMotion dur=".76s" calcMode="spline" keyTimes="0;1" keyPoints="0;1" keySplines=".42 0 .58 1"><mpath href="#left"/></animateMotion>
    <animate attributeName="opacity" dur=".76s" values="0;1;1;0" keyTimes="0;.09;.88;1"/>
  </g>
  <g opacity="0">
    <circle r="4.2" fill="url(#light)"/><circle r="1.25" fill="#fff9df"/>
    <animateMotion begin=".2s" dur=".76s" calcMode="spline" keyTimes="0;1" keyPoints="0;1" keySplines=".42 0 .58 1"><mpath href="#right"/></animateMotion>
    <animate attributeName="opacity" begin=".2s" dur=".76s" values="0;1;1;0" keyTimes="0;.09;.88;1"/>
  </g>
  <path class="spark" fill="#fff0aa" stroke="#c98552" stroke-width=".7" d="m24 26 1.3 3.8 3.7 1.2-3.7 1.2L24 36l-1.2-3.8-3.8-1.2 3.8-1.2Z"/>
</svg>

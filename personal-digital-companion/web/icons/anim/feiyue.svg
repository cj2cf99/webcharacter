<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#000">
  <style>
    .moon { transform-origin:12px 13px; animation:moon-hop 1.5s both }
    .spark { transform-origin:20px 5px; opacity:0; animation:spark-rise .52s .34s both }
    .trail { transform-origin:16px 5px; opacity:0; animation:spark-rise .40s .49s both }
    @keyframes moon-hop {
      0%,100% { transform:none }
      11% { transform:translate(-.7px,1.1px) rotate(-20deg) scale(1.07,.83); animation-timing-function:cubic-bezier(.12,.7,.24,1) }
      34% { transform:translate(1.4px,-3px) rotate(35deg) scale(.96); animation-timing-function:cubic-bezier(.55,0,.9,.7) }
      53% { transform:translate(.4px,1.15px) rotate(-14deg) scale(1.09,.86) }
      69% { transform:translateY(-1px) rotate(12deg) scale(.99,1.04) }
      84% { transform:translateY(.25px) rotate(-5deg) }
    }
    @keyframes spark-rise {
      0% { opacity:0; transform:translateY(1.2px) scale(.2) }
      30% { opacity:1; transform:scale(1.18) }
      63% { opacity:.95; transform:translateY(-.6px) scale(.87) }
      100% { opacity:0; transform:translateY(-1.2px) scale(.4) }
    }
  </style>
  <path class="moon" d="M20.9 15.3A8.8 8.8 0 0 1 8.7 3.1 9.2 9.2 0 1 0 20.9 15.3Z"/>
  <path class="spark" d="M20 2.1 20.8 4.2 23 5 20.8 5.8 20 8 19.2 5.8 17 5 19.2 4.2Z"/>
  <circle class="trail" cx="15.5" cy="3.5" r="1"/>
</svg>

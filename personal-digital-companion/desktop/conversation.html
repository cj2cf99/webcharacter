<!doctype html><html lang="zh-CN" class="fy-panel"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src data:"><title>绯月 · 本地复盘</title><link rel="stylesheet" href="feiyue-surface.css"><link rel="stylesheet" href="conversation.css"></head>
<body><header class="fy-titlebar"><div class="fy-caption"><h1>本地复盘</h1></div></header>
<main class="fy-scroll"><div class="filters"><div role="group" aria-label="记录类型"><button id="chat">对话</button><button id="tasks">任务复盘</button><button id="checks">提醒检查</button><button id="notices">提醒</button><button id="pending">待确认</button><button id="log">任务日志</button></div><label>东京日期 <input type="date" id="day"></label><button id="refreshLog" hidden>刷新日志</button></div>
<section id="schedule" hidden><strong id="nextCheck"></strong><span id="remaining"></span><small id="checkState"></small></section>
<section id="noticeControls" hidden><div role="group" aria-label="提醒筛选"><button data-filter="unread">未读</button><button data-filter="all">全部</button><button data-filter="read">已读</button><button id="readAll">一键已读</button></div><p id="noticeDetail"></p></section>
<nav id="checkPages" aria-label="检查记录分页" hidden><button id="previousCheck">上一页</button><span id="checkPage"></span><button id="nextCheckPage">下一页</button></nav>
<p id="status" role="status"></p><section id="turns"></section><button id="older" hidden>加载更早的日志</button></main>
<dialog id="taskReport" aria-labelledby="reportTitle"><header><h2 id="reportTitle">任务报告</h2><button id="reportClose" type="button">返回</button></header><div id="reportContents"></div></dialog>
<dialog id="pictureViewer" aria-label="全屏查看任务图片"><nav><button id="pictureScale" type="button">原始大小</button><button id="pictureClose" type="button">退出全屏</button></nav><div id="pictureCanvas"><img id="pictureOriginal" alt="任务结果原图"></div></dialog>
<script type="module" src="conversation-ui.mjs"></script></body></html>

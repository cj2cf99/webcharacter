<!doctype html>
<html lang="zh-CN" class="fy-panel">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>绯月 · 七日新闻简报</title>
  <link rel="stylesheet" href="feiyue-surface.css">
  <link rel="stylesheet" href="news-panel.css">
  <link rel="stylesheet" href="news-weekly.css">
  <link rel="stylesheet" href="news-editorial.css">
  <script type="module" src="news-panel-ui.mjs"></script>
</head>
<body>
  <header class="fy-titlebar">
    <div class="fy-caption"><h1>新闻简报</h1></div>
    <button id="refresh" class="fy-icon" type="button" aria-label="刷新简报" title="刷新简报"><span aria-hidden="true">↻</span></button>
  </header>
  <main class="fy-scroll">
    <div class="page">
      <header class="mast">
        <div class="nameplate">
          <h2>绯月<span>七日新闻</span></h2>
          <p id="edition">东京时间 JST</p>
        </div>
        <div class="engraving" aria-hidden="true"></div>
      </header>
      <div class="folio">
        <nav id="filters" aria-label="新闻栏目">
          <button type="button" aria-pressed="true">全部</button>
          <button type="button" aria-pressed="false">社会</button>
          <button type="button" aria-pressed="false">科技</button>
          <button type="button" aria-pressed="false">市场</button>
        </nav>
        <div class="folio-actions">
          <span id="pending-archive" class="demo" hidden></span>
          <button id="archive" type="button" class="paper-button">本地归档 ↗</button>
        </div>
      </div>
      <div class="reader" id="reader">
        <section class="overview" aria-label="七天事件">
          <div class="list-heading">
            <h3 id="overview-title" tabindex="-1">事件总览</h3>
            <p id="count"></p>
          </div>
          <div id="status" class="notice" role="status" hidden></div>
          <div id="hot-top" class="hot-top" hidden>
            <section class="hot-half week" aria-labelledby="week-h">
              <h4 id="week-h"><b>周</b>七日热点 <time id="week-at"></time></h4>
              <div id="week-map" data-heatmap></div>
            </section>
            <section class="hot-half day" aria-labelledby="day-h">
              <h4 id="day-h"><b>日</b>36 小时热点 <time id="day-at"></time></h4>
              <div id="day-map" data-heatmap></div>
            </section>
          </div>
          <div id="hot-rest" class="hot-rest" hidden>
            <section aria-labelledby="rest-week-h">
              <h4 id="rest-week-h" class="rest-head week">按周热度</h4>
              <div id="rest-week" class="rest-list"></div>
              <div class="rest-foot">
                <button type="button" class="paper-button more" data-for="rest-week" hidden>展开</button>
                <button type="button" class="paper-button less" data-for="rest-week" hidden>收起 ▴</button>
              </div>
            </section>
            <section aria-labelledby="rest-day-h">
              <h4 id="rest-day-h" class="rest-head day">按日热度</h4>
              <div id="rest-day" class="rest-list"></div>
              <div class="rest-foot">
                <button type="button" class="paper-button more" data-for="rest-day" hidden>展开</button>
                <button type="button" class="paper-button less" data-for="rest-day" hidden>收起 ▴</button>
              </div>
            </section>
          </div>
          <div class="back-top-slot">
            <button id="overview-top" type="button" class="back-top" aria-label="回到总览顶部" hidden>↑ 回到顶部</button>
          </div>
        </section>
        <div class="reader-backdrop" id="detail-backdrop" aria-hidden="true" hidden></div>
        <aside class="event-detail" id="event-detail" aria-labelledby="detail-title" hidden>
          <div class="detail-toolbar">
            <span>事件详情</span>
            <button id="close-detail" type="button" class="paper-button">收起详情 <span aria-hidden="true">×</span></button>
          </div>
          <div id="detail-content"></div>
          <div class="back-top-slot">
            <button id="detail-top" type="button" class="back-top" aria-label="回到详情顶部" hidden>↑ 回到顶部</button>
          </div>
        </aside>
      </div>
    </div>
  </main>
  <dialog id="photo-panel" aria-labelledby="photo-heading">
    <header class="dialog-head">
      <h2 id="photo-heading">新闻配图</h2>
      <form method="dialog"><button type="submit" aria-label="关闭大图">×</button></form>
    </header>
    <figure class="photo-preview">
      <img id="photo-full" alt="" decoding="async">
      <figcaption id="photo-credit"></figcaption>
      <p id="photo-state" class="notice" role="status" hidden></p>
    </figure>
  </dialog>
</body>
</html>

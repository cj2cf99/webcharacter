<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self' data:; object-src 'none'; base-uri 'none'">
  <title>绯月 · 提问</title>
  <link rel="stylesheet" href="feiyue-surface.css">
  <link rel="stylesheet" href="screen-question.css">
</head>
<body>
  <main class="bubble" data-tail="bottom">
    <header class="fy-titlebar fy-compact">
      <div class="fy-caption"><strong class="fy-caption-title">绯月</strong></div>
      <span id="badge">对话</span>
      <nav aria-label="对话工具">
        <button type="button" class="quiet" id="pending" hidden>待确认</button>
        <button type="button" class="quiet" id="history">对话记录</button>
      </nav>
      <button id="close" type="button" aria-label="关闭问答">×</button>
    </header>
    <section id="reply" aria-live="polite" aria-busy="false">
      <div id="replyContent">
        <small id="asked" hidden></small>
        <div class="response">
          <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
          <p id="answer">想聊什么，或记点什么？</p>
          <button id="retry" type="button" hidden>重试</button>
        </div>
        <button class="quiet" id="full" hidden>看全部</button>
        <span id="unsaved" hidden>记录未保存</span>
      </div>
    </section>
    <div id="decisions" hidden></div>
    <div id="imageResults" aria-live="polite" hidden></div>
    <form id="questionForm">
      <div id="attachment" hidden>
        <img id="attachmentImage" alt="" hidden>
        <span id="attachmentName"></span>
        <button id="removeAttachment" type="button" aria-label="移除附件">×</button>
      </div>
      <small id="attachmentError" role="status" hidden></small>
      <label class="sr" for="question">你的问题</label>
      <textarea id="question" rows="2" placeholder="问绯月，或记点什么…" aria-describedby="hint"></textarea>
      <footer>
        <label class="capture" title="附上鼠标所在屏幕的截图"><input id="withScreen" type="checkbox">附上截图</label>
        <select id="mode" aria-label="输入用途"><option value="auto">自动</option><option value="registration">登记</option><option value="web" disabled>查询网络（待重启）</option><option value="memory" disabled>查询记忆（未开放）</option></select>
        <span id="hint">Ctrl+Enter</span>
        <button id="send" type="submit">发送 ↗</button>
      </footer>
    </form>
  </main>
  <script type="module" src="screen-question-ui.mjs"></script>
</body>
</html>

<!doctype html>
<html lang="zh-CN" class="fy-panel">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'">
<title>绯月 · 今日任务</title>
<link rel="stylesheet" href="feiyue-surface.css">
<link rel="stylesheet" href="reminder-review.css">
<header class="fy-titlebar">
    <div class="fy-caption"><h1>今日任务</h1><time id="date"></time></div>
    <button type="button" id="refresh" class="fy-icon" aria-label="刷新" title="刷新">↻</button>
</header>
<main class="fy-scroll">
  <p id="status" class="fy-toast" role="status"></p>
  <div id="report" hidden role="region" aria-label="核对结果" tabindex="-1"></div>
  <div id="groups"></div>
</main>
<footer class="fy-foot"><span id="selected" class="fy-grow">未选择操作</span><button type="button" id="apply" class="primary" disabled>执行所选</button></footer>
<script type="module" src="reminder-review-ui.mjs"></script>
</html>

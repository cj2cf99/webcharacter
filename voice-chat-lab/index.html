<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#15111d">
  <title>绯月 · 语音对比实验台</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/page.mjs"></script>
</head>
<body>
  <main>
    <header>
      <div class="moon" aria-hidden="true"></div>
      <div><h1>绯月</h1><p>语音对比实验台</p></div>
      <div class="header-links"><span class="local">本机直连 · Aggressive 9B</span><a class="local" href="/read/">分段朗读</a></div>
    </header>

    <fieldset class="schemes">
      <legend>语音方案</legend>
      <label><input type="radio" name="scheme" value="gpt"><span><strong>GPT-SoVITS</strong><small>Paraformer 听写 · V5 Turbo 朗读</small></span></label>
      <label><input type="radio" name="scheme" value="sense" checked><span><strong>SenseVoiceSmall + MeloTTS</strong><small>多语听写 · 中文朗读</small></span></label>
    </fieldset>

    <section class="conversation" aria-label="对话">
      <p class="empty" id="welcome">录一段话或直接输入，绯月会用语音回复你。</p>
      <div id="turns" role="log" aria-label="聊天记录"></div>
    </section>

    <form id="composer">
      <label class="sr-only" for="message">你的话</label>
      <textarea id="message" rows="3" placeholder="说点什么，老公？"></textarea>
      <div class="actions">
        <button type="button" id="record" class="record"><span class="record-icon" aria-hidden="true"></span><span id="record-label">开始录音</span></button>
        <button type="button" id="sample" class="subtle">试用样音</button>
        <button type="button" id="repeat" class="subtle" disabled>重转写</button>
        <button type="submit" id="send" class="primary" disabled>发给绯月</button>
      </div>
      <div class="status-row"><p id="status" role="status" aria-live="polite">边说边转写，停止后可修改再发送。</p><span id="timer" aria-hidden="true" hidden></span></div>
    </form>
  </main>
</body>
</html>
